<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Beheer laadpaalshop | ElektroKlik</title>
<link rel="icon" href="../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --p: #0b7f75; --ink: #0f1b2d; --mut: #5b6b80; --line: #e3e8ef; --bg: #f5f7fa; --warn: #8a4b00; --warnbg: #fff7e8; --err: #c62828; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 'DM Sans', system-ui, sans-serif; color: #334155; background: var(--bg); }
  header { background: #0a1628; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  header h1 { font: 800 1.15rem 'Exo 2', sans-serif; margin: 0; }
  header .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h2 { font: 800 1.25rem 'Exo 2', sans-serif; color: var(--ink); margin: 0 0 4px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .card > p.hint { margin: 0 0 14px; color: var(--mut); font-size: .9rem; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: 600 .92rem 'DM Sans'; cursor: pointer; }
  .tabs button[aria-selected=true] { background: var(--p); color: #fff; border-color: var(--p); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
  label { display: block; font-weight: 600; font-size: .86rem; color: var(--ink); }
  label small { display: block; font-weight: 400; color: var(--mut); }
  input, textarea, select { width: 100%; margin-top: 4px; padding: 9px 10px; border: 1.5px solid #cfd8e3; border-radius: 8px; font: inherit; background: #fff; color: var(--ink); }
  input:focus, textarea:focus { outline: none; border-color: var(--p); box-shadow: 0 0 0 3px rgba(11,127,117,.15); }
  input[type=number] { max-width: 160px; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; margin: 0 6px 0 0; accent-color: var(--p); }
  textarea { min-height: 90px; }
  .full { grid-column: 1 / -1; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font: 700 .92rem 'DM Sans'; cursor: pointer; background: var(--p); color: #fff; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .btn.light { background: #fff; color: var(--ink); border: 1px solid #cfd8e3; }
  .sub { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 14px; }
  .sub h3 { font-size: 1rem; margin: 0 0 10px; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--mut); font-weight: 600; }
  td.num { text-align: right; white-space: nowrap; }
  .ok { color: var(--p); font-weight: 700; } .bad { color: var(--err); font-weight: 700; }
  .banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: .92rem; }
  .banner.warn { background: var(--warnbg); border: 1px solid #f3d199; color: var(--warn); }
  .banner.err { background: #fdecec; border: 1px solid #f5c2c2; color: var(--err); }
  .banner.ok { background: #e6f5f3; border: 1px solid #bfe3de; color: #0a5d56; }
  .dirty { display: none; background: #f5a04a; color: #0a1628; border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: .8rem; }
  .dirty.show { display: inline-block; }
  [hidden] { display: none !important; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>ElektroKlik · Beheer laadpaalshop <span class="dirty" id="dirty">Niet-opgeslagen wijzigingen</span></h1>
  <div class="acts">
    <button class="btn ghost" id="btnPreview" type="button">Bekijk de shop</button>
    <button class="btn light" id="btnDownload" type="button">Download config.json</button>
    <button class="btn" id="btnPublish" type="button">Publiceren…</button>
  </div>
</header>
<main>
  <div id="status"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
</main>
<script src="../laadpalen/assets/pricing.js"></script>
<script src="../uw-offerte/offerte-link.js"></script>
<script>
(function () {
  'use strict';
  var CFG = null, ORIG = '';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var eur = function (n) { return '€ ' + (Math.round(Number(n) * 100) / 100).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

  /* --- Pad-gebaseerde binding: data-path="producten.0.vanafprijs" --- */
  function get(path) { return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, CFG); }
  function set(path, val) {
    var ks = path.split('.'), o = CFG;
    for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val;
  }
  function f(path, label, type, hint, cls) {
    var v = get(path);
    if (type === 'lines') return '<label class="' + (cls || 'full') + '">' + label + (hint ? '<small>' + hint + '</small>' : '') + '<textarea data-path="' + path + '" data-type="lines">' + esc((v || []).join('\n')) + '</textarea></label>';
    if (type === 'textarea') return '<label class="' + (cls || 'full') + '">' + label + (hint ? '<small>' + hint + '</small>' : '') + '<textarea data-path="' + path + '">' + esc(v) + '</textarea></label>';
    if (type === 'bool') return '<label class="' + (cls || '') + '"><input type="checkbox" data-path="' + path + '" data-type="bool"' + (v ? ' checked' : '') + '>' + label + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
    return '<label class="' + (cls || '') + '">' + label + (hint ? '<small>' + hint + '</small>' : '') + '<input type="' + (type === 'number' ? 'number" step="1" min="0' : 'text') + '" data-path="' + path + '"' + (type === 'number' ? ' data-type="number"' : '') + ' value="' + esc(v) + '"></label>';
  }

  var TABS = [
    ['aanvragen', 'Aanvragen'], ['offertes', 'Offertes'], ['algemeen', 'Algemeen'], ['producten', 'Producten'], ['prijsregels', 'Installatie en toeslagen'],
    ['opties', 'Extra opties'], ['marge', 'Kosten en marge'], ['test', 'Prijs testen']
  ];

  function paneel(id) {
    var h = '';
    if (id === 'algemeen') {
      h += '<div class="card"><h2>Algemene instellingen</h2><p class="hint">Contactgegevens, het formulier-adres en de status van de prijzen.</p><div class="grid">' +
        f('instellingen.prijzenGoedgekeurd', 'Prijzen zijn goedgekeurd en definitief', 'bool', 'Uit = op de site staat overal “Voorbeeldprijs” en een testbanner.', 'full') +
        f('instellingen.conceptLabel', 'Tekst bij voorbeeldprijzen') +
        f('instellingen.telefoon', 'Telefoonnummer (zichtbaar)') + f('instellingen.telefoonLink', 'Telefoonnummer (link, met +31)') +
        f('instellingen.whatsappLink', 'WhatsApp-link') + f('instellingen.email', 'E-mailadres') +
        f('instellingen.formEndpoint', 'Formulier-adres (Formspree)', 'text', 'Hier komen de aanvragen binnen.') +
        f('instellingen.gtmContainerId', 'Google Tag Manager-ID', 'text', 'Bijv. GTM-ABC1234. Leeg = niet laden.') +
        f('instellingen.btwPercentage', 'Btw-percentage', 'number') + f('instellingen.privacyUrl', 'Adres van uw privacyverklaring', 'text', 'Bijv. /privacyverklaring/') + '</div></div>' +
        '<div class="card"><h2>Standaardinstallatie</h2><p class="hint">Eén regel per punt. Tekst tussen [VIERKANTE HAKEN IN HOOFDLETTERS] wordt op de site als gele placeholder getoond.</p><div class="grid">' +
        f('standaardInstallatie.inbegrepen', 'Standaard inbegrepen', 'lines') + '</div></div>';
    }
    if (id === 'producten') {
      CFG.producten.forEach(function (p, i) {
        var b = 'producten.' + i + '.';
        h += '<div class="card"><h2>' + esc(p.naam) + '</h2><div class="grid">' +
          f(b + 'naam', 'Productnaam') + f(b + 'merk', 'Merk') + f(b + 'positionering', 'Positionering') +
          (p.kabelVarianten ? p.kabelVarianten.map(function (v, j) { return f(b + 'kabelVarianten.' + j + '.prijs', 'Prijs met ' + esc(v.label.toLowerCase()) + ', incl. standaardinstallatie en btw (€)', 'number', j === 0 ? 'De vanafprijs wordt automatisch de laagste kabelprijs.' : ''); }).join('') : f(b + 'vanafprijs', 'Vanafprijs incl. standaardinstallatie en btw (€)', 'number')) +
          f(b + 'afbeelding', 'Productfoto', 'text', 'Pad of URL, bijv. assets/img/zaptec-go-2.jpg (map /laadpalen/). Leeg = illustratie.') +
          f(b + 'afbeeldingAlt', 'Omschrijving foto (voor blinden en Google)') +
          f(b + 'midGecertificeerd', 'Heeft een MID-gecertificeerde meter', 'bool', 'Bepaalt of zakelijke verrekening kan worden gekozen.', 'full') +
          f(b + 'kort', 'Korte omschrijving', 'textarea') +
          f(b + 'voordelen', 'Belangrijkste voordelen (één per regel)', 'lines') +
          f(b + 'geschiktVoor', 'Geschikt voor (één per regel)', 'lines') +
          f(b + 'minderGeschiktVoor', 'Minder geschikt voor (één per regel)', 'lines') +
          '</div><div class="sub"><h3>Specificaties</h3><div class="grid">' +
          Object.keys(p.specs).map(function (k) { return f(b + 'specs.' + k, k); }).join('') +
          f(b + 'bronnen', 'Bronnen (één URL per regel)', 'lines') + '</div></div></div>';
      });
    }
    if (id === 'prijsregels') {
      h += '<div class="card"><h2>Toeslagen per keuze</h2><p class="hint">Bedragen inclusief btw. De klant ziet bij deze technische vragen geen losse bedragen, alleen de bijgewerkte totaalprijs. Een beoordelingstekst verschijnt bij “Wat wij nog controleren” en in de aanvraag.</p>';
      EKPricing.VRAGEN.forEach(function (v) {
        var r = CFG.regels[v];
        h += '<div class="sub"><h3>' + esc(r.vraag) + '</h3><table><thead><tr><th>Keuze</th><th>Toeslag (€)</th><th>Beoordelingstekst (leeg = geen beoordeling)</th></tr></thead><tbody>' +
          r.keuzes.map(function (k, i) {
            var b = 'regels.' + v + '.keuzes.' + i + '.';
            var extra = k.route === 'offerte' ? ' <small style="color:var(--warn)">(→ offerteroute)</small>' : '';
            return '<tr><td>' + esc(k.label) + extra + '</td><td><input type="number" min="0" data-type="number" data-path="' + b + 'prijs" value="' + esc(k.prijs) + '"></td><td><input type="text" data-path="' + b + 'beoordeling" value="' + esc(k.beoordeling || '') + '"></td></tr>';
          }).join('') + '</tbody></table>' + (v === 'graafwerk' ? '<div class="grid" style="margin-top:10px">' + f('regels.graafwerk.prijsPerMeter', 'Graafwerk: prijs per meter (€)', 'number') + '</div>' : '') + '</div>';
      });
      h += '</div><div class="card"><h2>Per laadpaal</h2><p class="hint">Load balancing is bij alle laadpalen inbegrepen in de prijs. Hier legt u vast welke hardware daarvoor wordt geplaatst.</p><table><thead><tr><th>Onderdeel</th>' + CFG.producten.map(function (p) { return '<th>' + esc(p.naam) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        '<tr><td>Montagepaal (€)</td>' + CFG.producten.map(function (p) { return '<td><input type="number" min="0" data-type="number" data-path="regels.montagepaal.prijsPerProduct.' + p.id + '" value="' + esc(CFG.regels.montagepaal.prijsPerProduct[p.id]) + '"></td>'; }).join('') + '</tr>' +
        '<tr><td>Inbegrepen load balancing</td>' + CFG.producten.map(function (p) { return '<td><input type="text" data-path="regels.loadBalancing.labelPerProduct.' + p.id + '" value="' + esc(CFG.regels.loadBalancing.labelPerProduct[p.id]) + '"></td>'; }).join('') + '</tr></tbody></table></div>';
    }
    if (id === 'opties') {
      h += '<div class="card"><h2>Extra opties</h2><p class="hint">Bedragen inclusief btw.</p>';
      CFG.opties.forEach(function (o, i) {
        var b = 'opties.' + i + '.';
        h += '<div class="sub"><h3>' + esc(o.label) + '</h3><div class="grid">' + f(b + 'label', 'Naam') + f(b + 'prijs', 'Prijs (€)', 'number') + f(b + 'uitleg', 'Uitleg voor de klant', 'textarea') + '</div></div>';
      });
      h += '</div>';
    }
    if (id === 'marge') {
      h += '<div class="card"><h2>Kosten en marge</h2><p class="hint">Alleen voor intern gebruik: deze bedragen (exclusief btw) worden nooit aan klanten getoond.</p><div class="grid">' +
        f('kosten.uurtarief', 'Interne kosten per arbeidsuur (€ excl.)', 'number') + f('kosten.reistijdUren', 'Reistijd per klus (uren)', 'number') + f('kosten.reiskosten', 'Reiskosten per klus (€ excl.)', 'number') +
        f('standaardInstallatie.kosten.arbeidsuren', 'Arbeidsuren standaardinstallatie', 'number') + f('standaardInstallatie.kosten.materiaal', 'Materiaal standaardinstallatie (€ excl.)', 'number') + '</div>' +
        '<div class="sub"><h3>Inkoop per laadpaal</h3><div class="grid">' + CFG.producten.map(function (p, i) { return f('producten.' + i + '.kosten.inkoop', esc(p.naam) + ': laadpaal (€ excl.)', 'number') + f('regels.loadBalancing.kosten.' + p.id + '.inkoop', esc(p.naam) + ': load balancing (€ excl.)', 'number'); }).join('') + '</div></div>' +
        '<div class="sub"><h3>Uitkomst bij de standaardprijs</h3><div id="margeTabel"></div></div></div>';
    }
    if (id === 'aanvragen') {
      h += '<div class="card"><h2>Aanvragen</h2>' +
        '<p class="hint">Aanvragen komen binnen via Formspree (per e-mail en in het <a href="https://formspree.io/forms" target="_blank" rel="noopener">Formspree-dashboard</a>). Exporteer daar de inzendingen als CSV en importeer ze hier. U kunt per aanvraag de status bijhouden, notities maken en later ontvangen foto’s toevoegen.</p>' +
        '<div class="banner warn">Dit overzicht wordt bewaard in <b>deze browser op deze computer</b>. Gebruik “Back-up (JSON)” en “Back-up terugzetten” om het op een andere computer te openen. Met ✕ verwijdert u een aanvraag uit dit overzicht; de e-mail en de inzending in Formspree blijven bestaan.</div>' +
        '<p style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn" style="display:inline-block">CSV uit Formspree importeren<input type="file" id="regCsv" accept=".csv,text/csv" hidden></label>' +
        '<button class="btn light" type="button" id="regPlakOpen">Eén aanvraag plakken</button>' +
        '<button class="btn light" type="button" id="regExport">Exporteer overzicht (CSV)</button>' +
        '<button class="btn light" type="button" id="regBackup">Back-up (JSON)</button>' +
        '<label class="btn light" style="display:inline-block">Back-up terugzetten<input type="file" id="regRestore" accept=".json,application/json" hidden></label></p>' +
        '<div id="regPlak" hidden><textarea id="regPlakIn" placeholder="Plak hier het veld “Configuratie (technisch)” uit de e-mail"></textarea><p><button class="btn" type="button" id="regPlakGo">Toevoegen</button></p></div>' +
        '<p style="margin:10px 0"><input type="search" id="regZoek" placeholder="Zoek op naam, aanvraagnummer, plaats of laadpaal" style="max-width:420px"> <select id="regFilter" style="max-width:220px;display:inline-block"><option value="">Alle statussen</option>' + STATUSSEN.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></p>' +
        '<div id="regLijst"></div><div id="regDetail"></div></div>';
    }
    if (id === 'offertes') {
      h += '<div class="card"><h2>Offertes</h2>' +
        '<p class="hint">Maak hier een offerte. U krijgt een link en een aparte code voor de klant. De klant bekijkt de offerte, geeft akkoord en betaalt de aanbetaling via uw Tikkie-link. Bij een akkoord ontvangt u direct een e-mail.</p>' +
        '<div class="banner warn">Dit overzicht wordt bewaard in <b>deze browser op deze computer</b>. De offerte zelf zit in de link en werkt altijd, ook als dit overzicht leeg is. Gebruik “Back-up maken” om het overzicht op een andere computer te openen.</div>' +
        '<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="offNieuw">Nieuwe offerte</button>' +
        '<select id="offVanAanvraag" style="max-width:340px;display:inline-block;margin:0"><option value="">Offerte maken van een aanvraag…</option></select>' +
        '<button class="btn light" type="button" id="offInstOpen">Instellingen</button>' +
        '<button class="btn light" type="button" id="offBackup">Back-up maken</button>' +
        '<label class="btn light" style="display:inline-block">Back-up terugzetten<input type="file" id="offRestore" accept=".json,application/json" hidden></label></p>' +
        '<div id="offInst" hidden></div><div id="offLijst"></div><div id="offEditor"></div></div>';
    }
    if (id === 'test') {
      h += '<div class="card"><h2>Prijs testen</h2><p class="hint">Plak het veld “Configuratie (technisch)” uit een aanvraag om de prijs met de huidige instellingen na te rekenen, of open de configurator.</p>' +
        '<textarea id="testIn" placeholder=\'{"ref":"EK-…","staat":{…}}\'></textarea><p><button class="btn" type="button" id="testGo">Reken na</button> <a class="btn light" href="../laadpalen/samenstellen/" target="_blank" style="text-decoration:none;display:inline-block">Open de configurator</a></p><div id="testOut"></div></div>';
    }
    return h;
  }


  /* ===================== Aanvraagregister ===================== */
  var STATUSSEN = ['Nieuw', 'In behandeling', 'Wacht op foto’s', 'Offerte verstuurd', 'Akkoord', 'Betaald', 'Ingepland', 'Geïnstalleerd', 'Geannuleerd'];
  var REG = (function () {
    var KEY = 'ek_register_v1', data = { items: {} }, open = null;
    function laad() { try { data = JSON.parse(localStorage.getItem(KEY) || '{"items":{}}'); } catch (e) { data = { items: {} }; } }
    function bewaar() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert('Opslaan in deze browser is niet gelukt.'); } }
    /* --- foto's in IndexedDB --- */
    function db() {
      return new Promise(function (res, rej) {
        var r = indexedDB.open('ek_beheer', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('fotos', { keyPath: 'id', autoIncrement: true }).createIndex('ref', 'ref'); };
        r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
      });
    }
    function fotos(ref) { return db().then(function (d) { return new Promise(function (res) { var out = [], q = d.transaction('fotos').objectStore('fotos').index('ref').openCursor(IDBKeyRange.only(ref)); q.onsuccess = function () { var c = q.result; if (c) { out.push(c.value); c.continue(); } else res(out); }; }); }); }
    function fotoBewaar(ref, file, soort) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction('fotos', 'readwrite'); t.objectStore('fotos').add({ ref: ref, naam: file.name, soort: soort, blob: file, datum: new Date().toISOString() }); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }); }
    function fotoWis(id) { return db().then(function (d) { return new Promise(function (res) { var t = d.transaction('fotos', 'readwrite'); t.objectStore('fotos').delete(id); t.oncomplete = res; }); }); }
    /* --- CSV --- */
    function csv(text) {
      var rows = [], row = [], cel = '', q = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (q) { if (ch === '"') { if (text[i + 1] === '"') { cel += '"'; i++; } else q = false; } else cel += ch; }
        else if (ch === '"') q = true;
        else if (ch === ',' || ch === ';') { row.push(cel); cel = ''; }
        else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cel); rows.push(row); row = []; cel = ''; }
        else cel += ch;
      }
      if (cel || row.length) { row.push(cel); rows.push(row); }
      var kop = rows.shift() || [];
      return rows.filter(function (r) { return r.some(function (c) { return c.trim(); }); }).map(function (r) { var o = {}; kop.forEach(function (k, i) { o[k.trim()] = r[i] || ''; }); return o; });
    }
    function kolom(o, re) { for (var k in o) if (re.test(k) && o[k]) return o[k]; return ''; }
    function uitRij(o) {
      var tech = null, t = kolom(o, /configuratie.*technisch/i);
      try { tech = t ? JSON.parse(t) : null; } catch (e) { tech = null; }
      var ref = (tech && tech.ref) || kolom(o, /^(aanvraagnummer|referentie)$/i);
      if (!ref) return null;
      return {
        ref: ref, datum: kolom(o, /submitted|created|date|datum/i) || '', bron: 'csv',
        naam: (tech && tech.klant && tech.klant.naam) || kolom(o, /^naam$/i), email: (tech && tech.klant && tech.klant.email) || kolom(o, /e-?mail/i),
        telefoon: (tech && tech.klant && tech.klant.telefoon) || kolom(o, /telefoon/i), adres: (tech && tech.klant && tech.klant.adres) || kolom(o, /installatieadres/i),
        tech: tech, velden: o
      };
    }
    function voegToe(a) {
      var bestaand = data.items[a.ref];
      data.items[a.ref] = Object.assign({ status: 'Nieuw', notities: '' }, bestaand || {}, a, bestaand ? { status: bestaand.status, notities: bestaand.notities } : {});
    }
    /* --- weergave --- */
    function label(v, id) { var k = EKPricing.keuze(CFG, v, id); return k ? k.label : (id || '–'); }
    function lijst() {
      var el = $('#regLijst'); if (!el) return;

      el.innerHTML = '<table><tr><th>Totaal incl. btw</th><td class="num"><b>' + eur(tt.totaal) + '</b></td></tr><tr><td>Waarvan btw</td><td class="num">' + eur(tt.btw) + '</td></tr><tr><td>Aanbetaling (' + esc(r.o.aanbetalingPercentage) + '%)</td><td class="num"><b>' + eur(tt.aanbetaling) + '</b></td></tr><tr><td>Na de installatie</td><td class="num">' + eur(tt.rest) + '</td></tr></table>';
    }
    function maakLink() {
      var r = data.items[bewerk], o = r.o;
      if (!o.klant.naam || !o.regels.some(function (x) { return x.omschrijving && Number(x.bedrag) > 0; })) return alert('Vul ten minste de naam van de klant en één regel met een bedrag in.');
      if (o.betaallink && !/^https:\/\//i.test(o.betaallink)) return alert('De Tikkie-link moet beginnen met https://');
      if (r.token) { r.versie++; }
      var code = EKOfferte.nieuweCode();
      var offerte = { nr: r.nr, versie: r.versie, datum: vandaag(), geldigTot: o.geldigTot, aanvraag: o.aanvraag, titel: o.titel, klant: o.klant,
        regels: o.regels.filter(function (x) { return x.omschrijving || Number(x.bedrag); }).map(function (x) { return { omschrijving: x.omschrijving, bedrag: Math.round(Number(x.bedrag) * 100) / 100 }; }),
        btwPercentage: CFG.instellingen.btwPercentage, aanbetalingPercentage: Number(o.aanbetalingPercentage) || 0, inbegrepen: o.inbegrepen, garantie: o.garantie,
        installatiedatum: o.installatiedatum, opmerking: o.opmerking, betaallink: o.betaallink, voorwaardenUrl: inst.voorwaardenUrl, garantieUrl: inst.garantieUrl,
        bedrijf: inst.bedrijf, formEndpoint: CFG.instellingen.formEndpoint };
      $('#offLink').disabled = true; $('#offLink').textContent = 'Bezig…';
      EKOfferte.versleutel(offerte, code).then(function (token) {
        r.token = token; r.code = code; r.link = location.origin + '/uw-offerte/#o=' + token; r.verstuurd = new Date().toISOString(); r.verstuurdeVersie = r.versie;
        if (r.status === 'Concept') r.status = 'Verstuurd';
        bewaar(); lijst(); open(r.nr);
      });
    }
    function toonResultaat(r) {
      var el = $('#offResultaat'); if (!el) return;
      var voornaam = (r.o.klant.naam || '').split(' ')[0];
      var b1 = 'Goedendag ' + (voornaam || '') + ',\n\nHierbij uw offerte van ElektroKlik' + (r.o.titel ? ' voor de ' + r.o.titel.charAt(0).toLowerCase() + r.o.titel.slice(1) : '') + ':\n' + r.link + '\n\nDe code om de offerte te openen stuur ik u in een apart bericht. In de offerte kunt u direct akkoord geven' + (r.o.betaallink ? ' en de aanbetaling voldoen' : '') + '.\n\nMet vriendelijke groet,\nElektroKlik';
      var b2 = 'De code voor uw offerte ' + r.nr + ' is: ' + r.code;
      el.innerHTML = '<div class="banner ok"><b>Versie ' + r.verstuurdeVersie + ' klaar om te versturen.</b> Stuur de link en de code in twee aparte berichten, bijvoorbeeld de link per e-mail en de code via WhatsApp.</div>' +
        '<div class="grid"><label class="full">Bericht 1: de link<textarea readonly id="offB1" style="min-height:150px">' + esc(b1) + '</textarea></label>' +
        '<label class="full">Bericht 2: de code<textarea readonly id="offB2" style="min-height:50px">' + esc(b2) + '</textarea></label></div>' +
        '<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-kopieer="offB1">Kopieer bericht 1</button><button class="btn" type="button" data-kopieer="offB2">Kopieer bericht 2</button>' +
        (r.o.klant.telefoon ? '<a class="btn light" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/' + esc(waNummer(r.o.klant.telefoon)) + '?text=' + encodeURIComponent(b2) + '">Code via WhatsApp sturen</a>' : '') +
        (r.o.klant.email ? '<a class="btn light" style="text-decoration:none" href="mailto:' + esc(r.o.klant.email) + '?subject=' + encodeURIComponent('Uw offerte ' + r.nr + ' van ElektroKlik') + '&body=' + encodeURIComponent(b1) + '">Link per e-mail sturen</a>' : '') +
        '<a class="btn light" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(r.link) + '">Bekijk als klant</a></p>';
    }
    function waNummer(t) { var n = String(t).replace(/[^0-9+]/g, ''); if (n.indexOf('+') === 0) return n.slice(1); if (n.indexOf('00') === 0) return n.slice(2); if (n.indexOf('0') === 0) return '31' + n.slice(1); return n; }
    function toonInst() {
      var el = $('#offInst'); el.hidden = !el.hidden; if (el.hidden) return;
      var b = inst.bedrijf;
      el.innerHTML = '<div class="sub"><h3>Instellingen voor nieuwe offertes</h3><div class="grid">' +
        '<label>Standaard geldig (dagen)<input type="number" min="1" data-offinst="geldigheidDagen" value="' + esc(inst.geldigheidDagen) + '"></label>' +
        '<label>Standaard aanbetaling (%)<input type="number" min="0" data-offinst="aanbetalingPercentage" value="' + esc(inst.aanbetalingPercentage) + '"></label>' +
        '<label class="full">Adres van uw algemene voorwaarden<small>Leeg laten zolang ze niet op de website staan.</small><input type="url" data-offinst="voorwaardenUrl" value="' + esc(inst.voorwaardenUrl) + '"></label>' +
        '<label class="full">Adres van uw garantievoorwaarden<input type="url" data-offinst="garantieUrl" value="' + esc(inst.garantieUrl) + '"></label>' +
        '<label class="full">Standaard garantieregels (één per regel)<textarea data-offinst="garantie" data-lines="1">' + esc(inst.garantie.join('\n')) + '</textarea></label>' +
        ['naam', 'adres', 'kvk', 'btw', 'telefoon', 'telefoonLink', 'email'].map(function (k) { return '<label>' + { naam: 'Bedrijfsnaam', adres: 'Adres', kvk: 'KvK-nummer', btw: 'Btw-nummer', telefoon: 'Telefoon (zichtbaar)', telefoonLink: 'Telefoon (link, met +31)', email: 'E-mail' }[k] + '<input type="text" data-offbedrijf="' + k + '" value="' + esc(b[k]) + '"></label>'; }).join('') +
        '</div><p class="hint" style="margin-top:8px">Wijzigingen worden direct bewaard en gelden voor nieuwe links.</p></div>';
    }
    function zetPad(o, pad, v) { var ks = pad.split('.'); for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
    var gebonden = false;
    function init() {
      laad(); lijst(); vulAanvragen();
      if (gebonden) return; gebonden = true;
      document.addEventListener('input', function (e) {
        var t = e.target, r = bewerk && data.items[bewerk];
        if (t.hasAttribute('data-off') && r) { var v = t.hasAttribute('data-lines') ? t.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean) : (t.hasAttribute('data-num') ? Number(t.value) : t.value); zetPad(r.o, t.getAttribute('data-off'), v); bewaar(); totalen(); }
        if (t.hasAttribute('data-offregel') && r) { var i = +t.getAttribute('data-offregel'), k = t.getAttribute('data-k'); r.o.regels[i][k] = k === 'bedrag' ? Number(t.value) : t.value; bewaar(); totalen(); }
        if (t.hasAttribute('data-offinst')) { var ik = t.getAttribute('data-offinst'); inst[ik] = t.hasAttribute('data-lines') ? t.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean) : (t.type === 'number' ? Number(t.value) : t.value); bewaar(); }
        if (t.hasAttribute('data-offbedrijf')) { inst.bedrijf[t.getAttribute('data-offbedrijf')] = t.value; bewaar(); }
      });
      document.addEventListener('change', function (e) {
        var t = e.target;
        if (t.id === 'offVanAanvraag' && t.value) { vanAanvraag(t.value); lijst(); t.value = ''; }
        if (t.hasAttribute && t.hasAttribute('data-offstatus')) { data.items[t.getAttribute('data-offstatus')].status = t.value; bewaar(); }
        if (t.id === 'offRestore' && t.files[0]) { t.files[0].text().then(function (txt) { try { var d = JSON.parse(txt); Object.keys(d.items || {}).forEach(function (k) { data.items[k] = d.items[k]; }); if (d.instellingen) inst = Object.assign(standaardInst(), d.instellingen); bewaar(); lijst(); alert('Back-up teruggezet.'); } catch (er) { alert('Dit is geen geldige back-up.'); } t.value = ''; }); }
      });
      document.addEventListener('click', function (e) {
        var t = e.target;
        if (t.id === 'offNieuw') { var r = leeg(); data.items[r.nr] = r; bewaar(); lijst(); open(r.nr); }
        var o = t.closest('[data-offopen]'); if (o) open(o.getAttribute('data-offopen'));
        var w = t.closest('[data-offwis]'); if (w) { var nr = w.getAttribute('data-offwis'); if (confirm('Offerte ' + nr + ' uit dit overzicht verwijderen? Een al verstuurde link blijft werken tot de geldigheidsdatum.')) { delete data.items[nr]; bewaar(); lijst(); if (bewerk === nr) { bewerk = null; $('#offEditor').innerHTML = ''; } } }
        if (t.closest('[data-offsluit]')) { bewerk = null; $('#offEditor').innerHTML = ''; }
        if (t.id === 'offRegelPlus') { data.items[bewerk].o.regels.push({ omschrijving: '', bedrag: 0 }); bewaar(); open(bewerk); }
        var rw = t.closest('[data-offregelwis]'); if (rw) { data.items[bewerk].o.regels.splice(+rw.getAttribute('data-offregelwis'), 1); bewaar(); open(bewerk); }
        if (t.id === 'offLink') maakLink();
        if (t.id === 'offInstOpen') toonInst();
        if (t.id === 'offBackup') { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ items: data.items, instellingen: inst }, null, 1)], { type: 'application/json' })); a.download = 'offertes-backup.json'; a.click(); }
        var k = t.closest('[data-kopieer]'); if (k) { var ta = $('#' + k.getAttribute('data-kopieer')); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(function () { k.textContent = 'Gekopieerd ✓'; }, function () { document.execCommand('copy'); k.textContent = 'Gekopieerd ✓'; }); }
      });
    }
    return { init: init };
  })();

  function margeTabel() {
    var el = $('#margeTabel'); if (!el) return;
    var k = CFG.kosten, si = CFG.standaardInstallatie.kosten, btw = 1 + CFG.instellingen.btwPercentage / 100;
    el.innerHTML = '<table><thead><tr><th>Laadpaal</th><th class="num">Prijs incl. btw</th><th class="num">Omzet excl. btw</th><th class="num">Kosten</th><th class="num">Marge</th><th class="num">Marge %</th></tr></thead><tbody>' +
      CFG.producten.map(function (p) {
        var excl = p.vanafprijs / btw;
        var lbk = ((CFG.regels.loadBalancing.kosten || {})[p.id] || {}).inkoop || 0;
        var kost = Number(p.kosten.inkoop || 0) + Number(lbk) + Number(si.materiaal || 0) + (Number(si.arbeidsuren || 0) + Number(k.reistijdUren || 0)) * Number(k.uurtarief || 0) + Number(k.reiskosten || 0);
        var m = excl - kost, pct = excl ? m / excl * 100 : 0;
        return '<tr><td>' + esc(p.naam) + '</td><td class="num">' + eur(p.vanafprijs) + '</td><td class="num">' + eur(excl) + '</td><td class="num">' + (kost ? eur(kost) : '<i>nog niet ingevuld</i>') + '</td><td class="num ' + (m < 0 ? 'bad' : 'ok') + '">' + eur(m) + '</td><td class="num">' + (kost ? pct.toFixed(1) + '%' : '–') + '</td></tr>';
      }).join('') + '</tbody></table><p class="hint" style="font-size:.85rem;color:var(--mut)">Kosten = inkoop laadpaal + inkoop load balancing + materiaal + (arbeidsuren + reistijd) × uurtarief + reiskosten.</p>';
  }

  function valideer() {
    var fouten = EKPricing.valideerConfig(CFG);
    var s = $('#status');
    var h = '';
    if (fouten.length) h += '<div class="banner err"><b>Er zijn fouten. Publiceren is geblokkeerd tot deze zijn opgelost:</b><ul>' + fouten.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    if (!CFG.instellingen.prijzenGoedgekeurd) h += '<div class="banner warn">De prijzen staan op <b>voorbeeld</b>. Op de website staat een testbanner en bij iedere prijs “' + esc(CFG.instellingen.conceptLabel) + '”.</div>';
    s.innerHTML = h;
    $('#btnPublish').disabled = !!fouten.length;
    return fouten;
  }

  function markeer() { $('#dirty').classList.toggle('show', JSON.stringify(CFG) !== ORIG); valideer(); margeTabel(); }

  function toonTab(id) {
    document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === id)); });
    $('#panels').innerHTML = paneel(id);
    margeTabel();
    if (id === 'aanvragen') REG.init();
    if (id === 'offertes') OFF.init();
    if (id === 'test') $('#testGo').addEventListener('click', function () {
      try {
        var o = JSON.parse($('#testIn').value); var st = o.staat || o;
        var r = EKPricing.bereken(CFG, st);
        $('#testOut').innerHTML = '<table>' + r.regels.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td class="num">' + eur(x.bedrag) + '</td></tr>'; }).join('') + '<tr><th>Totaal incl. btw</th><th class="num">' + eur(r.totaal) + '</th></tr></table>' +
          (o.totaal !== undefined ? '<p class="' + (o.totaal === r.totaal ? 'ok' : 'bad') + '">Bedrag in de aanvraag: ' + eur(o.totaal) + (o.totaal === r.totaal ? ' (gelijk)' : ' (wijkt af: de prijzen zijn sindsdien gewijzigd)') + '</p>' : '');
      } catch (e) { $('#testOut').innerHTML = '<p class="bad">Dit is geen geldige configuratie.</p>'; }
    });
  }

  document.addEventListener('input', function (e) {
    var el = e.target, path = el.getAttribute('data-path'); if (!path) return;
    var t = el.getAttribute('data-type'), v;
    if (t === 'bool') v = el.checked;
    else if (t === 'number') v = el.value === '' ? '' : Number(el.value);
    else if (t === 'lines') v = el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    else v = el.value;
    if (path.slice(-12) === '.beoordeling' && v === '') { var ks = path.split('.'); var o = get(ks.slice(0, -1).join('.')); delete o.beoordeling; }
    else set(path, v);
    var kv = path.match(/^producten\.(\d+)\.kabelVarianten\./);
    if (kv) { var pr = CFG.producten[+kv[1]]; var pr2 = pr.kabelVarianten.map(function (x) { return Number(x.prijs); }).filter(function (x) { return x > 0; }); if (pr2.length) pr.vanafprijs = Math.min.apply(null, pr2); }
    markeer();
  });
  document.addEventListener('change', function (e) { if (e.target.getAttribute('data-type') === 'bool') e.target.dispatchEvent(new Event('input', { bubbles: true })); });

  function bestand() {
    CFG.laatstGewijzigd = new Date().toISOString().slice(0, 10);
    CFG.versie = CFG.laatstGewijzigd + '.' + Date.now().toString(36);
    return JSON.stringify(CFG, null, 2) + '\n';
  }

  $('#btnDownload').addEventListener('click', function () {
    if (valideer().length) return alert('Los eerst de fouten op.');
    var blob = new Blob([bestand()], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'config.json'; a.click();
    alert('config.json is gedownload. Vervang hiermee het bestand laadpalen/data/config.json in uw website (bijvoorbeeld via GitHub → Upload files).');
  });
  $('#btnPreview').addEventListener('click', function () { window.open('../laadpalen/', '_blank'); });

  /* Publiceren via de GitHub API (token blijft alleen in deze browsersessie) */
  $('#btnPublish').addEventListener('click', function () {
    if (valideer().length) return;
    var ss = function (k, d) { try { return sessionStorage.getItem(k) || d; } catch (e) { return d; } };
    var repo = prompt('GitHub-repository (eigenaar/naam):', ss('ek_repo', ''));
    if (!repo) return;
    var branch = prompt('Branch (gebruik eerst een test-branch, bijv. "staging"):', ss('ek_branch', 'staging'));
    if (!branch) return;
    var token = ss('ek_token', '') || prompt('Persoonlijk GitHub-token (fine-grained, alleen “Contents: read & write” op deze repository). Het token wordt alleen in deze browsersessie bewaard.');
    if (!token) return;
    try { sessionStorage.setItem('ek_repo', repo); sessionStorage.setItem('ek_branch', branch); sessionStorage.setItem('ek_token', token); } catch (e) {}
    var url = 'https://api.github.com/repos/' + repo + '/contents/laadpalen/data/config.json';
    var hdr = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
    var inhoud = bestand();
    fetch(url + '?ref=' + encodeURIComponent(branch), { headers: hdr }).then(function (r) { return r.ok ? r.json() : {}; }).then(function (cur) {
      return fetch(url, { method: 'PUT', headers: hdr, body: JSON.stringify({ message: 'Laadpaalshop: prijzen/inhoud bijgewerkt via beheer', content: btoa(unescape(encodeURIComponent(inhoud))), branch: branch, sha: cur.sha }) });
    }).then(function (r) {
      if (!r.ok) throw new Error('GitHub antwoordde met ' + r.status);
      ORIG = JSON.stringify(CFG); markeer();
      $('#status').insertAdjacentHTML('afterbegin', '<div class="banner ok">Gepubliceerd naar <b>' + esc(branch) + '</b>. Het kan een paar minuten duren voordat de wijziging zichtbaar is.</div>');
    }).catch(function (e) {
      try { sessionStorage.removeItem('ek_token'); } catch (x) {}
      alert('Publiceren is niet gelukt: ' + e.message + '. Controleer de repository, de branch en het token. U kunt ook “Download config.json” gebruiken.');
    });
  });

  window.addEventListener('beforeunload', function (e) { if (JSON.stringify(CFG) !== ORIG) { e.preventDefault(); e.returnValue = ''; } });

  fetch('../laadpalen/data/config.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
    CFG = c; ORIG = JSON.stringify(c);
    $('#tabs').innerHTML = TABS.map(function (t) { return '<button type="button" role="tab" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('');
    $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) toonTab(b.dataset.tab); });
    toonTab('aanvragen'); valideer();
  }).catch(function () { $('#status').innerHTML = '<div class="banner err">De configuratie kon niet worden geladen.</div>'; });
})();
</script>
</body>
</html>
